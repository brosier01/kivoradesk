# KivoraDesk: the agent's code runs as an unprivileged account on this kernel.

# Refuse writes to files and FIFOs of other accounts in shared directories
# such as /tmp, whatever their permissions.
fs.protected_regular = 2
fs.protected_fifos = 2

# Keep kernel addresses and the loading of line disciplines from local accounts.
kernel.kptr_restrict = 2
dev.tty.ldisc_autoload = 0
