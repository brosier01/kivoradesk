# The MCP server (desktop account) runs shell commands and file operations
# as the unprivileged worker, and nothing else.
permit nopass agent as worker cmd /usr/local/bin/kivora-mcp

# It also asks the vault for what it needs to fill a field. It cannot change
# the credentials or their sites: only the human can, from the admin account.
permit nopass agent as kivora-vault cmd /usr/local/bin/kivora-vault args list
permit nopass agent as kivora-vault cmd /usr/local/bin/kivora-vault args value
