# The MCP server (desktop account) runs shell commands and file operations
# as the unprivileged worker, and nothing else. Not logged: the system log would
# keep the text of each command, which the audit log masks.
permit nopass nolog agent as worker cmd /usr/local/bin/kivora-mcp
permit nopass agent as worker cmd /usr/lib/ssh/sftp-server args -d /workspace

# It also asks the vault for what it needs to fill a field. It cannot change
# the credentials or their sites: only the human can, from the admin account.
permit nopass agent as kivora-vault cmd /usr/local/bin/kivora-vault args list
permit nopass agent as kivora-vault cmd /usr/local/bin/kivora-vault args value
# And it has each result cleaned of the stored values, once per tool call.
permit nopass nolog agent as kivora-vault cmd /usr/local/bin/kivora-vault args scrub

# Audit entries go to an account that keeps them out of the agent's reach: it
# can add some, not change or delete those already there.
permit nopass agent as kivora-audit cmd /usr/local/bin/kivora-audit args record
