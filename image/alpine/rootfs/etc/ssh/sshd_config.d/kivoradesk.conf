# KivoraDesk: the agent account may only forward to the web gateway, so a
# laptop can open the live view tunnel and nothing else.
Match User agent
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:6080 localhost:6080
	X11Forwarding no
	AllowAgentForwarding no
	PermitListen none

# Reset the match context so that settings read after this file apply to everyone.
Match all
