# KivoraDesk: only the accounts meant to log in may, with keys.
DenyUsers worker kivora-web kivora-vault
KbdInteractiveAuthentication no

# The agent account's keys are outside its home: nothing running as the agent
# can add one. It may only forward to the web gateway, so a laptop can open the
# live view tunnel and nothing else.
Match User agent
	AuthorizedKeysFile /etc/ssh/authorized_keys/%u
	# File transfers run as the worker: run as the agent, they would follow a
	# link left in /workspace into the agent's private files.
	Subsystem sftp /usr/bin/doas -u worker /usr/lib/ssh/sftp-server -d /workspace
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:6080 localhost:6080
	AllowStreamLocalForwarding no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	PermitListen none

# Reset the match context so that settings read after this file apply to everyone.
Match all
