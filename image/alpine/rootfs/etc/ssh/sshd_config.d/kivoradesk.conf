# KivoraDesk: only the accounts meant to log in may, with keys.
AllowUsers agent kivora
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# Every client reaches this server from the VM's gateway. Punishing that address
# for the failures of one client would lock out the laptops and the admin commands.
PerSourcePenaltyExemptList 10.86.0.1/32
LoginGraceTime 20

# A laptop that vanished does not keep its MCP server running here.
ClientAliveInterval 60

# The agent account's keys are outside its home: nothing running as the agent
# can add one. A laptop gets the MCP server, file transfers and a tunnel to the web
# gateway, and no shell: see /usr/local/bin/kivora-session.
Match User agent
	AuthorizedKeysFile /etc/ssh/authorized_keys/%u
	ForceCommand /usr/local/bin/kivora-session
	PermitTTY no
	# File transfers run as the worker: run as the agent, they would follow a
	# link left in /workspace into the agent's private files.
	Subsystem sftp /usr/bin/doas -u worker /usr/lib/ssh/sftp-server -d /workspace
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:680 localhost:680
	AllowStreamLocalForwarding no
	PermitUserRC no
	X11Forwarding no
	AllowAgentForwarding no
	PermitListen none

# Reset the match context so that settings read after this file apply to everyone.
Match all
